includeBuild(file(providers.gradleProperty('gtlcore_source').get()).toPath().resolve('migration/dependencies/adastrarocketed').toFile()) {
    name = 'adastrarocketed-native'
    dependencySubstitution {
        substitute module('org.gtlcore.dependencies:ad_astra_rocketed-neoforge') using project(':')
    }
}

includeBuild(file(providers.gradleProperty('gtlcore_source').get()).toPath().resolve('migration/dependencies/wildcardpattern').toFile()) {
    name = 'wildcardpattern-native'
    dependencySubstitution {
        substitute module('org.gtlcore.dependencies:wildcard-pattern-neoforge') using project(':')
    }
