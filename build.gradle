plugins {
    id 'java-library'
    id 'maven-publish'
    id 'org.jetbrains.kotlin.jvm'
    alias libs.plugins.modDevGradle
    alias libs.plugins.lombok
}

group = project.maven_group
version = project.mod_version
base { archivesName = "${project.archives_base_name}-${libs.versions.minecraft.get()}" }
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}
lombok { version = '1.18.38' }
sourceSets.main.resources.srcDir('src/generated/resources')
kotlin {
    jvmToolchain(21)
    sourceSets.main.kotlin.srcDir('src/main/java')
}

apply from: 'gradle/repositories.gradle'

// AE2's published POM also lists a legacy Forge GuideME; use the verified native artifact below.
configurations.configureEach { exclude group: 'org.appliedenergistics', module: 'guideme' }
configurations {
    maybeCreate('localRuntime').canBeResolved = false
    runtimeClasspath.extendsFrom(localRuntime)
}

neoForge {
    version = libs.versions.neoForge.get()
    parchment {
        minecraftVersion = libs.versions.minecraft.get()
        mappingsVersion = libs.versions.parchment.get()
    }
    mods {
        "${project.mod_id}" { sourceSet(sourceSets.main) }
    }
    runs {
        client { client(); gameDirectory = file('run/client') }
        server { server(); gameDirectory = file(providers.gradleProperty('native_server_directory').orElse('run/server').get()); programArgument '--nogui' }
        data {
            data()
            gameDirectory = file('run/data')
            programArguments.addAll('--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources').absolutePath,
                    '--existing', file('src/main/resources').absolutePath)
        }
        configureEach {
            systemProperty 'mixin.debug.verify', 'true'
            systemProperty 'mixin.debug.strict.unique', 'true'
            systemProperty 'mixin.checks', 'true'
            logLevel = org.slf4j.event.Level.INFO
        }
    }
}

dependencies {
    implementation('com.gregtechceu.gtceu:gtceu-1.21.1:8.0.0')
    implementation('com.hepdd.gtmthings:gtmthings:1.6.0')
    implementation('org.gtlcore.gtlcore:gtlcore-1.21.1:1.2.3.2-fix4')
    implementation('curse.maven:ftb-ultimine-forge-386134:6846404')
    implementation(forge.ae2)
    implementation(forge.registrate)
    implementation(forge.configuration)
    implementation(forge.mui)
    // Published NeoForge artifacts verified through Modrinth's loader and game-version metadata.
    implementation('maven.modrinth:ldlib:oe3VmoEH')
    implementation('maven.modrinth:ad-astra:9pnKHdCG')
    implementation('maven.modrinth:re-avaritia:uY1x1LTC')
    implementation(forge.resourcefullib)
    implementation('maven.modrinth:resourceful-config:lSbyRD6v')
    implementation('maven.modrinth:common-storage-lib:SCkdlli6')
    implementation('maven.modrinth:extended-ae:bC302UUP')
    implementation('maven.modrinth:applied-energistics-2-wireless-terminals:CxSEpEnO')
    // The implementation bundles this API for runtime; expose its published artifact to javac.
    compileOnly('de.mari_023:ae2wtlib_api:19.5.1') { transitive = false }
    implementation('maven.modrinth:glodium:pfbmdJ3b')
    implementation('maven.modrinth:guideme:hFpGwC6q')
    implementation('maven.modrinth:merequester:E46AplqZ')
    compileOnly(forge.bundles.kjs)
    compileOnly(forge.bundles.jei)
    compileOnly('tamaized.ae2jeiintegration:ae2jeiintegration:1.2.0')
    localRuntime('tamaized.ae2jeiintegration:ae2jeiintegration:1.2.0')
    localRuntime(forge.bundles.jei)
    compileOnly(forge.emi)
    compileOnly(forge.iris)
    compileOnly(forge.jade)
    compileOnly(forge.curios)
    compileOnly(forge.ftblibrary)
    compileOnly(forge.ftbteams)
    compileOnly(forge.ftbchunks)
    runtimeOnly(forge.bundles.kjs)
    runtimeOnly(forge.jade)
    runtimeOnly(forge.curios)
    implementation('maven.modrinth:sgjourney:mZTmQ1wW')
    // Keep the published Kotlin library aggregator and its native KFF language/runtime components
    // in the runtime export; the language loader is a separate library without a mod ID.
    implementation(variantOf(forge.kotlinforforge) { classifier('all') })
    jarJar(implementation('org.scilab.forge:jlatexmath:1.0.7'))
    // Guide math rendering loads these published runtime font registrations reflectively.
    jarJar(implementation('org.scilab.forge:jlatexmath-font-greek:1.0.7'))
    jarJar(implementation('org.scilab.forge:jlatexmath-font-cyrillic:1.0.7'))
    jarJar(implementation('com.github.ben-manes.caffeine:caffeine:3.1.8'))
    // Plain libraries bundled in the production JAR also need to be visible in source-based runs.
    additionalRuntimeClasspath 'org.scilab.forge:jlatexmath:1.0.7'
    additionalRuntimeClasspath 'com.github.ben-manes.caffeine:caffeine:3.1.8'

}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs.add('-Xmaxerrs')
    options.compilerArgs.add('1000')
}

processResources {
    def properties = [mod_id: mod_id, mod_name: mod_name, mod_license: mod_license,
                      mod_author: mod_author, mod_url: mod_url, version: project.version,
                      minecraft_version: libs.versions.minecraft.get(),
                      neo_version: libs.versions.neoForge.get(), loader_version: libs.versions.loader.get(),
                      gtceu_version: '8.0.0', ae2_version: forge.versions.ae2.get()]
    inputs.properties(properties)
    filesMatching('META-INF/neoforge.mods.toml') { expand(properties) }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java
        }
    }
}

apply from: 'gradle/migration-regression.gradle'
apply from: 'gradle/native-validation.gradle'
apply from: 'gradle/native-machine-validation.gradle'
apply from: 'gradle/native-stargate-validation.gradle'
apply from: 'gradle/native-production-validation.gradle'
